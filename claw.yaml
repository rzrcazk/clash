proxy-groups:
  - name: "🚀 节点选择"
    type: select
    proxies:
      - ✈️ 自动选择
      - 🇭🇰 香港
      - 🇭🇰 香港300G
      - 🇺🇸 美国 5T
      - 🇺🇸 美东 无限
      - 直连-vless
      - 直连-tuic
      - zoro伪家宽-4837线路200m2t-vless
      - zoro伪家宽-4837线路200m2t-tuic
      - US-10.29-4T
      - 洛杉矶
      - US-Chenxin
      - JP-Chiyoda-City
      - DIRECT

  # 自动测速：定期测延迟，��动挑最快
  - name: "✈️ 自动选择"
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    proxies:
      - 🇭🇰 香港
      - 🇭🇰 香港300G
      - 🇺🇸 美国 5T
      - 🇺🇸 美东 无限
      - 直连-vless
      - 直连-tuic
      - zoro伪家宽-4837线路200m2t-vless
      - zoro伪家宽-4837线路200m2t-tuic
      - US-10.29-4T
      - 洛杉矶
      - US-Chenxin
      - JP-Chiyoda-City

  # 负载均衡：分散流量到多个节点
  - name: 负载均衡
    type: load-balance
    url: https://www.gstatic.com/generate_204
    interval: 300
    strategy: round-robin
    proxies:
      - 🇭🇰 香港
      - 🇭🇰 香港300G
      - 🇺🇸 美国 5T
      - 🇺🇸 美东 无限
      - 直连-vless
      - 直连-tuic
      - zoro伪家宽-4837线路200m2t-vless
      - zoro伪家宽-4837线路200m2t-tuic
      - US-10.29-4T
      - 洛杉矶
      - US-Chenxin
      - JP-Chiyoda-City

