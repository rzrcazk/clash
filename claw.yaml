port: 7890
allow-lan: true
mode: rule
log-level: info
unified-delay: true
global-client-fingerprint: chrome
dns:
  enable: false
  listen: :53
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 8.8.8.8
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.0.0.1/dns-query
    - tls://dns.google
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

proxies:
  - name: vless-reality-vision-s27312
    type: vless
    server: 47.79.33.98
    port: 14819
    uuid: c3b94fe6-3121-4056-9240-0038d85ecc51
    network: tcp
    udp: true
    tls: true
    flow: xtls-rprx-vision
    servername: www.yahoo.com
    reality-opts:
      public-key: 6yP151CRvBSxgd_-1MVvW0w2sgC5KPthEb5u1YqQxFw
      short-id: 1b24c1ab
    client-fingerprint: chrome

  - name: vmess-ws-s27312
    type: vmess
    server: 47.79.33.98
    port: 8080
    uuid: c3b94fe6-3121-4056-9240-0038d85ecc51
    alterId: 0
    cipher: auto
    udp: true
    tls: false
    network: ws
    servername: www.bing.com
    ws-opts:
      path: "c3b94fe6-3121-4056-9240-0038d85ecc51-vm"
      headers:
        Host: www.bing.com

  - name: hysteria2-s27312
    type: hysteria2
    server: 47.79.33.98
    port: 17716
    password: c3b94fe6-3121-4056-9240-0038d85ecc51
    alpn:
      - h3
    sni: www.bing.com
    skip-cert-verify: true
    fast-open: true

  - name: tuic5-s27312
    server: 47.79.33.98
    port: 17510
    type: tuic
    uuid: c3b94fe6-3121-4056-9240-0038d85ecc51
    password: c3b94fe6-3121-4056-9240-0038d85ecc51
    alpn: [h3]
    disable-sni: true
    reduce-rtt: true
    udp-relay-mode: native
    congestion-controller: bbr
    sni: www.bing.com
    skip-cert-verify: true

  # SOCKS5落地节点
  - name: landing-socks5-1
    type: socks5
    server: 45.194.100.181
    port: 53853
    username: KshY68XV2LCPKDr
    password: 9fFGv3JLTDExKee
    udp: true

  - name: landing-socks5-2
    type: socks5
    server: 207.228.42.131
    port: 46688
    username: 00QDXWq85Zg8KNo
    password: 9qTGqHqv5TDFFTX
    udp: true

proxy-groups:
  # 主要代理组 - 用户选择的入口
  - name: PROXY
    type: select
    proxies:
      - vless-chain-1
      - vless-chain-2
      - vmess-chain-1
      - vmess-chain-2
      - hysteria2-chain-1
      - hysteria2-chain-2
      - tuic5-chain-1
      - tuic5-chain-2
      - DIRECT

  # 链式代理组 - 每个原节点通过不同落地节点
  - name: vless-chain-1
    type: relay
    proxies:
      - vless-reality-vision-s27312
      - landing-socks5-1

  - name: vless-chain-2
    type: relay
    proxies:
      - vless-reality-vision-s27312
      - landing-socks5-2

  - name: vmess-chain-1
    type: relay
    proxies:
      - vmess-ws-s27312
      - landing-socks5-1

  - name: vmess-chain-2
    type: relay
    proxies:
      - vmess-ws-s27312
      - landing-socks5-2

  - name: hysteria2-chain-1
    type: relay
    proxies:
      - hysteria2-s27312
      - landing-socks5-1

  - name: hysteria2-chain-2
    type: relay
    proxies:
      - hysteria2-s27312
      - landing-socks5-2

  - name: tuic5-chain-1
    type: relay
    proxies:
      - tuic5-s27312
      - landing-socks5-1

  - name: tuic5-chain-2
    type: relay
    proxies:
      - tuic5-s27312
      - landing-socks5-2

  # 落地节点负载均衡组
  - name: landing-balance
    type: load-balance
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - landing-socks5-1
      - landing-socks5-2

rules:
  # 直连规则
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT
  - IP-CIDR,172.16.0.0/12,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT
  - IP-CIDR,17.0.0.0/8,DIRECT
  - IP-CIDR,100.64.0.0/10,DIRECT
  
  # 默认使用代理
  - MATCH,PROXY