proxy-groups:
  - name: 负载均衡
    type: load-balance
    url: https://www.gstatic.com/generate_204
    interval: 300
    strategy: round-robin
    proxies:
      - 直连-vless
      - 直连-tuic
      - zoro伪家宽-4837线路200m2t-vless
      - zoro伪家宽-4837线路200m2t-tuic
      - US-10.29-4T
      - 洛杉矶

  - name: 自动选择
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - 直连-vless
      - 直连-tuic
      - zoro伪家宽-4837线路200m2t-vless
      - zoro伪家宽-4837线路200m2t-tuic
      - US-10.29-4T
      - 洛杉矶

  - name: 🌍选择代理节点
    type: select
    proxies:
      - 负载均衡
      - 自动选择
      - DIRECT
      - 直连-vless
      - 直连-tuic
      - zoro伪家宽-4837线路200m2t-vless
      - zoro伪家宽-4837线路200m2t-tuic
      - US-10.29-4T
      - 洛杉矶
rules:
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,🌍选择代理节点
