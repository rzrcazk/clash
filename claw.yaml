proxy-groups:
  - name: 负载均衡
    type: load-balance
    url: https://www.gstatic.com/generate_204
    interval: 300
    strategy: round-robin
    proxies:
      - 直连-vless
      - 直连-tuic
      - 美-45.194.100.181-vless
      - 美-45.194.100.181-tuic
      - 美-207.228.42.131-vless
      - 美-207.228.42.131-tuic
      - 美-68.170.3.215-vless
      - 美-68.170.3.215-tuic

  - name: 自动选择
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - 直连-vless
      - 直连-tuic
      - 美-45.194.100.181-vless
      - 美-45.194.100.181-tuic
      - 美-207.228.42.131-vless
      - 美-207.228.42.131-tuic
      - 美-68.170.3.215-vless
      - 美-68.170.3.215-tuic

  - name: 🌍选择代理节点
    type: select
    proxies:
      - 负载均衡
      - 自动选择
      - DIRECT
      - 直连-vless
      - 直连-tuic
      - 美-45.194.100.181-vless
      - 美-45.194.100.181-tuic
      - 美-207.228.42.131-vless
      - 美-207.228.42.131-tuic
      - 美-68.170.3.215-vless
      - 美-68.170.3.215-tuic
rules:
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,🌍选择代理节点
