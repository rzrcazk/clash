port: 7890
allow-lan: true
mode: rule
log-level: info
unified-delay: true
global-client-fingerprint: chrome
dns:
  enable: false
  listen: :53
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 8.8.8.8
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.0.0.1/dns-query
    - tls://dns.google
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

proxies:
  # 直连节点组
  - name: 直连-vless
    type: vless
    server: 47.79.33.98
    port: 8443
    uuid: 160787c1-f590-4449-cb32-7e7ece624f4f
    network: tcp
    udp: true
    tls: true
    flow: xtls-rprx-vision
    servername: www.tesla.com
    reality-opts:
      public-key: mr66Ab0DccIxMy0vMVgAxI6U8NqY4bd6YlmXvCeck0A
    client-fingerprint: chrome

  - name: 直连-tuic
    type: tuic
    server: 47.79.33.98
    port: 8443
    uuid: 160787c1-f590-4449-cb32-7e7ece624f4f
    password: KE71ymHsMu
    alpn: [h3, h2, http/1.1]
    congestion-controller: bbr
    skip-cert-verify: true
    sni: www.tesla.com

  - name: zoro伪家宽-4837线路200m2t-vless
    type: vless
    server: 47.79.33.98
    port: 8443
    uuid: 092be669-80e7-4108-edd1-28255e9a6a88
    network: tcp
    udp: true
    tls: true
    flow: xtls-rprx-vision
    servername: www.tesla.com
    reality-opts:
      public-key: mr66Ab0DccIxMy0vMVgAxI6U8NqY4bd6YlmXvCeck0A
    client-fingerprint: chrome

  - name: zoro伪家宽-4837线路200m2t-tuic
    type: tuic
