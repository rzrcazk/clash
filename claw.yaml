port: 7890
allow-lan: true
mode: rule
log-level: info
unified-delay: true
global-client-fingerprint: chrome
dns:
  enable: false
  listen: :53
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 8.8.8.8
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.0.0.1/dns-query
    - tls://dns.google
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

proxies:
  - name: vless-reality-vision-s27312
    type: vless
    server: 47.79.33.98
    port: 14819
    uuid: c3b94fe6-3121-4056-9240-0038d85ecc51
    network: tcp
    udp: true
    tls: true
    flow: xtls-rprx-vision
    servername: www.yahoo.com
    reality-opts:
      public-key: 6yP151CRvBSxgd_-1MVvW0w2sgC5KPthEb5u1YqQxFw
      short-id: 1b24c1ab
    client-fingerprint: chrome

  - name: vmess-ws-s27312
    type: vmess
    server: 47.79.33.98
    port: 8080
    uuid: c3b94fe6-3121-4056-9240-0038d85ecc51
    alterId: 0
    cipher: auto
    udp: true
    tls: false
    network: ws
    servername: www.bing.com
    ws-opts:
      path: "c3b94fe6-3121-4056-9240-0038d85ecc51-vm"
      headers:
        Host: www.bing.com

  - name: hysteria2-s27312
    type: hysteria2
    server: 47.79.33.98
    port: 17716
    password: c3b94fe6-3121-4056-9240-0038d85ecc51
    alpn:
      - h3
    sni: www.bing.com
    skip-cert-verify: true
    fast-open: true

  - name: tuic5-s27312
    server: 47.79.33.98
    port: 17510
    type: tuic
    uuid: c3b94fe6-3121-4056-9240-0038d85ecc51
    password: c3b94fe6-3121-4056-9240-0038d85ecc51
    alpn: [h3]
    disable-sni: true
    reduce-rtt: true
    udp-relay-mode: native
    congestion-controller: bbr
    sni: www.bing.com
    skip-cert-verify: true
  - name: vmess-tls-argo临时-s27312
    type: vmess
    server: www.visa.com.sg
    port: 8443
    uuid: c3b94fe6-3121-4056-9240-0038d85ecc51
    alterId: 0
    cipher: auto
    udp: true
    tls: true
    network: ws
    servername: annotated-distant-eastern-notices.trycloudflare.com
    ws-opts:
      path: "c3b94fe6-3121-4056-9240-0038d85ecc51-vm"
      headers:
        Host: annotated-distant-eastern-notices.trycloudflare.com

  - name: vmess-argo临时-s27312
    type: vmess
    server: www.visa.com.sg
    port: 8880
    uuid: c3b94fe6-3121-4056-9240-0038d85ecc51
    alterId: 0
    cipher: auto
    udp: true
    tls: false
    network: ws
    servername: annotated-distant-eastern-notices.trycloudflare.com
    ws-opts:
      path: "c3b94fe6-3121-4056-9240-0038d85ecc51-vm"
      headers:
        Host: annotated-distant-eastern-notices.trycloudflare.com

proxy-groups:
  - name: 负载均衡
    type: load-balance
    url: https://www.gstatic.com/generate_204
    interval: 300
    strategy: round-robin
    proxies:
      - vless-reality-vision-s27312
      - vmess-ws-s27312
      - hysteria2-s27312
      - tuic5-s27312
      - vmess-tls-argo临时-s27312
      - vmess-argo临时-s27312

  - name: 自动选择
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - vless-reality-vision-s27312
      - vmess-ws-s27312
      - hysteria2-s27312
      - tuic5-s27312
      - vmess-tls-argo临时-s27312
      - vmess-argo临时-s27312

  - name: 🌍选择代理节点
    type: select
    proxies:
      - 负载均衡
      - 自动选择
      - DIRECT
      - vless-reality-vision-s27312
      - vmess-ws-s27312
      - hysteria2-s27312
      - tuic5-s27312
      - vmess-tls-argo临时-s27312
      - vmess-argo临时-s27312
rules:
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,🌍选择代理节点
